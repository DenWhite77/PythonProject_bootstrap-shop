<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Контакты</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="index.html">Магазин</a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Главная</a>
                <a class="nav-link" href="catalog.html">Каталог</a>
                <a class="nav-link" href="category.html">Категории</a>
                <a class="nav-link" href="orders.html">Заказы</a>
                <a class="nav-link active" href="contacts.html">Контакты</a>
            </div>
        </div>
    </nav>

<main class="container py-4">

    <header class="mb-4">
        <h1>Контакты</h1>
        <p class="lead">Свяжитесь с нами</p>
    </header>

    <form>

        <div class="mb-3">
            <label for="name" class="form-label">Ваше имя</label>
            <input type="text" class="form-control" id="name" placeholder="Введите имя">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Электронная почта</label>
            <input type="email" class="form-control" id="email" placeholder="Введите email">
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Сообщение</label>
            <textarea class="form-control" id="message" rows="5"
                      placeholder="Введите сообщение"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">
            Отправить
        </button>

    </form>

</main>

    <footer>
        <p>© 2026 Bootstrap Project</p>
    </footer>

</body>
</html>
